# Fly.io deployment for the Proof Gatekeeper agent.
# BEFORE DEPLOYING: change `app` to your own unique name, then:
#   fly launch --no-deploy
#   fly secrets set AGENT_SECRET=<secret shown once at agent registration>
#   fly deploy
# The secret is NEVER committed and NEVER written in this file.
#
# IMPORTANT: keep at least one machine running. Free-tier machines that
# sleep after inactivity will miss tasks — an offline agent forfeits
# tasks (see /rules §1.4). That is why auto_stop_machines is off and
# min_machines_running is 1 below.

app = "agent-games-gatekeeper"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  AGENT_NAME = "gatekeeper"
  GATEKEEPER_WASM = "/app/circuits/gatekeeper.wasm"
  GATEKEEPER_ZKEY = "/app/circuits/gatekeeper_final.zkey"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/agent"
    timeout = "5s"
